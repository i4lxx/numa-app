name: Publicar APK de Android

# Se ejecuta a mano: GitHub -> Actions -> "Publicar APK de Android" -> Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # necesario para crear la Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Compila el APK en los servidores de Expo (EAS) y espera a que termine
      - name: Compilar APK en EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait

      - name: Descargar el APK terminado
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(npx eas-cli build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          echo "Descargando: $URL"
          curl -fL "$URL" -o numa.apk

      # La página de Numa descarga siempre este enlace fijo:
      # https://github.com/i4lxx/numa-app/releases/latest/download/Numa.apk
      # (el nombre del archivo debe ser exactamente Numa.apk, con N mayúscula)
      # La etiqueta lleva "v" + la versión de app.json (ej. v1.1.0): la página la
      # muestra como "versión 1.1.0". Si publicas otra vez la misma versión,
      # se reemplaza la Release anterior.
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v$VERSION"
          mv numa.apk Numa.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" Numa.apk \
            --title "Numa $VERSION" \
            --notes "APK de Android de Numa versión $VERSION" \
            --latest
